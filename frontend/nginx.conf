server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ──────────────────────────────────────────────
    # React Router handles all routes in JavaScript.
    # If a file doesn't exist on disk (e.g. /dashboard, /reviews/5),
    # fall through to index.html and let React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Proxy ─────────────────────────────────────────────────
    # Forward all /api, /auth, /webhooks requests to the FastAPI backend.
    # In Docker Compose, the backend service is named "api".
    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhooks {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Static asset caching ──────────────────────────────────────
    # Vite generates hashed filenames (main.abc123.js).
    # These can be cached aggressively — 1 year — since the hash
    # changes whenever the content changes.
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
