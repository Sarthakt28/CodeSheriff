# .github/workflows/ci.yml
# CodeSheriff CI — runs on every push and pull request
#
# Jobs:
#   backend-test  — lint (ruff) + type-check (mypy) + pytest
#   frontend-test — type-check (tsc) + lint (eslint) + build

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Backend ──────────────────────────────────────────────────────────────────
jobs:
  backend-test:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install without heavy ML packages for CI speed
          pip install fastapi uvicorn sqlalchemy pydantic pydantic-settings \
                      python-dotenv httpx python-jose bcrypt requests pygments \
                      celery redis psycopg2-binary
          pip install pytest pytest-asyncio ruff mypy types-requests

      - name: Lint (ruff)
        run: ruff check app/ tests/ --select E,F,W,I --ignore E501
        continue-on-error: true  # treat as warning until codebase is fully clean

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          REDIS_URL: redis://localhost:6379/0
          GITHUB_CLIENT_ID: ci_client_id
          GITHUB_CLIENT_SECRET: ci_client_secret
          GITHUB_WEBHOOK_SECRET: ci_webhook_secret
          JWT_SECRET_KEY: ci_jwt_secret
          USE_ML_REVIEWER: "false"
        run: pytest tests/test_diff_parser.py tests/test_rules_reviewer.py -v --tb=short

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        env:
          VITE_GITHUB_CLIENT_ID: ci_client_id
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
