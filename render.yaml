# render.yaml — Render Infrastructure as Code for CodeSheriff
# Automatically deploys: Managed PostgreSQL, Valkey/Redis, FastAPI Backend + Celery Worker, and React Frontend.

services:
  # ── 1. Backend Web Service (FastAPI + Embedded Celery Worker) ───────────────
  # Runs both API and background worker in one container to fit within Render Free Tier.
  - type: web
    name: codesheriff-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "bash start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codesheriff-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: codesheriff-redis
          property: connectionString
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: USE_ML_REVIEWER
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"

  # ── 2. Frontend Static Site (React SPA) ──────────────────────────────────────
  - type: web
    name: codesheriff-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GITHUB_CLIENT_ID
        value: "Ov23liJ4rBIBQK49dO6M"
      - key: VITE_API_URL
        value: "https://codesheriff-api-wgg8.onrender.com"

  # ── 3. Redis / KeyValue Task Broker ─────────────────────────────────────────
  - type: keyvalue
    name: codesheriff-redis
    region: oregon
    plan: free
    ipAllowList: [] # internal Render network only

# ── Databases ────────────────────────────────────────────────────────────────
databases:
  - name: codesheriff-postgres
    region: oregon
    plan: free
    databaseName: codesheriff
    user: sheriff
